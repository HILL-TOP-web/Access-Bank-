<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | Mine App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-box {
      background: #11162a;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1f6fff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1557d6;
    }

    .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #1f6fff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>Reset Password</h2>

    <input type="email" id="email" placeholder="Enter your email" />

    <button onclick="resetPassword()">Send Reset Link</button>

    <div class="links">
      <p><a href="login.html">Back to login</a></p>
    </div>
  </div>

  <script>
    function resetPassword() {
      const email = document.getElementById("email").value;

      if (!email) {
        alert("Email is required");
        return;
      }

      fetch("https://YOUR_API_URL/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || "If the email exists, a reset link has been sent");
      })
      .catch(() => alert("Server error"));
    }
  </script>

</body>
</html>
